{% extends "layout.html" %}
{% block title %}生成结果预览 - 医学知识库系统{% endblock %}
{% block page_title %}生成结果预览与编辑{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>自动生成结果 - 人工编辑审核</h3>
        <a href="{{ url_for('knowledge_generate') }}" class="btn btn-default btn-sm">← 重新生成</a>
    </div>
    <div class="card-body">
        <div class="flash flash-info">
            以下内容由系统自动生成，请仔细审核修改后保存。确认无误后可保存为草稿或直接提交审核。
        </div>
        <form method="POST">
            <div class="form-row">
                <div class="form-group" style="flex:2;">
                    <label>知识标题</label>
                    <input type="text" name="title" class="form-control" value="{{ title }}">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>所属分类</label>
                    <select name="category_id" class="form-control">
                        <option value="0">— 请选择 —</option>
                        {% for c in categories %}
                            <option value="{{ c.id }}" {% if cat_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="preview-section">
                <label>摘要</label>
                <textarea name="summary" class="form-control" rows="2">{{ data.summary }}</textarea>
            </div>
            <div class="preview-section">
                <label>定义</label>
                <textarea name="definition" class="form-control" rows="3">{{ data.definition }}</textarea>
            </div>
            <div class="preview-section">
                <label>病因</label>
                <textarea name="etiology" class="form-control" rows="3">{{ data.etiology }}</textarea>
            </div>
            <div class="preview-section">
                <label>临床表现</label>
                <textarea name="clinical_manifestation" class="form-control" rows="4">{{ data.clinical_manifestation }}</textarea>
            </div>
            <div class="preview-section">
                <label>诊断标准</label>
                <textarea name="diagnosis" class="form-control" rows="4">{{ data.diagnosis }}</textarea>
            </div>
            <div class="preview-section">
                <label>治疗方案</label>
                <textarea name="treatment" class="form-control" rows="4">{{ data.treatment }}</textarea>
            </div>
            <div class="preview-section">
                <label>预防措施</label>
                <textarea name="prevention" class="form-control" rows="3">{{ data.prevention }}</textarea>
            </div>
            <div class="preview-section">
                <label>参考文献</label>
                <textarea name="references" class="form-control" rows="2">{{ data.references }}</textarea>
            </div>
            <div class="preview-section">
                <label>标签（逗号分隔）</label>
                <input type="text" name="tags" class="form-control" placeholder="如：内分泌,慢性病">
            </div>
            <div class="form-group" style="margin-top:20px;">
                <button type="submit" name="action" value="save" class="btn btn-primary">保存为草稿</button>
                <button type="submit" name="action" value="submit" class="btn btn-success">保存并提交审核</button>
                <a href="{{ url_for('knowledge_generate') }}" class="btn btn-default">放弃</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
